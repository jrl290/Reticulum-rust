[package]
name = "reticulum_rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rnsd"
path = "src/bin/rnsd.rs"

[features]
default = ["serial", "post-interface"]
serial = ["dep:serialport", "dep:btleplug", "dep:uuid", "dep:futures"]
post-interface = ["dep:reqwest", "dep:base64", "dep:serde_json"]
# Phone-to-RTNode Bluetooth LE (Prns native protocol, central side); the
# phone apps drive the radio. Off by default: rnsd and rfed never use it.
prns-ble = []
python-oracle-tests = []

[dependencies]
chrono = "0.4"
# "termination" adds SIGTERM/SIGHUP to the handler. The reference installs
# SIGINT *and* SIGTERM handlers (Reticulum.py:375-376) so `service rnsd stop`
# reaches exit_handler() and persists the path table; without it a stop was a
# plain kill and destination_table was up to path_table_save_interval stale.
ctrlc = { version = "3.4", features = ["termination"] }
once_cell = "1.19"
parking_lot = "0.12"
rand = "0.8"
bzip2 = "0.4"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
rmp = "=0.8.14"
rmpv = "=1.0.0"
rmp-serde = "=1.1.2"
serde_bytes = "0.11"
x25519-dalek = { version = "=1.1.1" }
ed25519-dalek = { version = "=1.0.1", features = ["rand"] }
hkdf = "=0.12.3"
aes = "=0.8.3"
cbc = "=0.1.2"
hmac = "=0.12.1"
block-padding = "=0.3.3"
libc = "0.2"
# Known destinations store (src/known_destinations.rs). 0.31 with bundled
# SQLite, as apns-bridge and fcm-bridge use: libsqlite3-sys links one native
# sqlite3, so every crate in a build must resolve the same version.
rusqlite = { version = "0.31", features = ["bundled"] }
socket2 = "0.5"
if-addrs = { version = "0.10", features = ["link-local"] }
windows-sys = { version = "0.52", features = ["Win32_NetworkManagement_IpHelper", "Win32_Foundation"] }
serialport = { version = "4.3", optional = true }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync", "time"] }
btleplug = { version = "0.11", optional = true }
uuid = { version = "1.7", optional = true }
futures = { version = "0.3", optional = true }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false, optional = true }
base64 = { version = "0.22", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
data-encoding = "2.5"
pyo3 = { version = "0.21", features = ["auto-initialize"] }
